<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>Twister Chaser</title>
  <meta name="description" content="Every surveyed US tornado of 2026 on a 3D terrain map, with playback of each tornado's path.">
  <link rel="stylesheet" href="vendor/maplibre/maplibre-gl.css">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/map.css">
</head>
<body data-view="3d">
  <div id="map" aria-label="Map of 2026 US tornado tracks"></div>

  <div id="loading" role="status">
    <p id="loadingText">Loading terrain and tornado tracks</p>
  </div>

  <header id="brand" class="panel">
    <h1>Twister Chaser</h1>
    <p id="brandSub"></p>
    <ul id="legend" class="legend" aria-label="Tornadoes by EF rating"></ul>
  </header>

  <div id="viewToggle" class="panel" role="group" aria-label="Map view">
    <button data-view="3d" aria-pressed="true">3D terrain</button>
    <button data-view="flat" aria-pressed="false">Flat overview</button>
  </div>

  <div id="tip" role="tooltip" hidden></div>

  <aside id="card" class="panel" aria-label="Tornado details" hidden>
    <button id="cardClose" class="close" aria-label="Close details">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    <header class="ro-head">
      <span id="cChip" class="chip" aria-label="EF rating"></span>
      <div class="ro-title">
        <h2 id="cName"></h2>
        <p id="cSub"></p>
      </div>
    </header>
    <p id="cNear" class="dim"></p>
    <dl id="cStats" class="stats card-stats"></dl>

    <h3>Human impact</h3>
    <p id="cImpact"></p>

    <h3>Tornado warning</h3>
    <div id="cWarn"></div>

    <details id="cNotesWrap">
      <summary>NWS survey notes</summary>
      <pre id="cNotes"></pre>
    </details>

    <div class="actions">
      <a id="cWatch" class="primary" href="playback.html">Watch</a>
      <p id="cWatchNote" class="dim"></p>
    </div>
    <p id="cSrc" class="src"></p>
  </aside>

  <script type="module" src="js/app.js"></script>
</body>
</html>
