# Builds and deploys Twister Chaser to GitHub Pages.
#   * every push to main deploys the site as it is
#   * every day (and on demand) it first re-pulls the 2026 tornado data from the NWS and Iowa Mesonet,
#     rebuilds it, commits the changed data files, then deploys
# One-time setup: repository Settings > Pages > Build and deployment > Source: GitHub Actions.
name: Deploy site

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 10 * * *"   # 10:17 UTC, about 5 a.m. Central
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  DATA_YEAR: "2026"   # change when the site moves to a new year

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refresh 2026 data
        if: github.event_name != 'push'
        run: |
          python3 -m pip install --quiet -r requirements.txt
          python3 scripts/fetch_data.py --year "$DATA_YEAR"
          python3 scripts/build_data.py --year "$DATA_YEAR"
          python3 - <<'PY'
          import json
          d = json.load(open("data/tornadoes-2026.json"))
          n = len(d["tornadoes"])
          print("tornadoes:", n)
          # A broken upstream response must never replace good data with an empty map.
          assert n >= 500, f"only {n} tornadoes, refusing to publish"
          PY

      - name: Commit refreshed data
        if: github.event_name != 'push'
        run: |
          git config user.name "twisterchaser-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data docs
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Daily data refresh $(date -u +%F)"
            git push
          fi

      - name: Assemble site
        run: |
          mkdir -p _site/data
          cp index.html _site/
          cp -r web _site/web
          # Only the files the pages load. Raw downloads and build inputs stay out.
          cp data/*.json data/*.geojson _site/data/
          cp -r data/swaths _site/data/swaths
          touch _site/.nojekyll
          du -sh _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
