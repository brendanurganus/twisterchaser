<title>Twister Chaser Lite</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&display=swap">
<style>
/* Storm-center dark: one deliberate look. Blue-black ground, cool white text, ice-blue controls,
   SPC EF colors for ratings, NWS red only for warnings, gold only for the famous ten.
   Layout: a side panel with search, filters, lists and cards beside a flat canvas map; stacked on phones. */
:root {
  --bg: #0a1118; --panel: #0e1822; --panel-2: #132130; --edge: rgba(143, 200, 240, 0.16);
  --text: #dce8f2; --haze: #8d9fb2; --ice: #8fc8f0; --ice-dim: rgba(143, 200, 240, 0.16);
  --warn: #e0453a; --good: #7fd6a4; --gold: #ffd36e; --land: #0e1b27;
  --display: "VT323", "Courier New", monospace;
  --font: "Bahnschrift", "Barlow Semi Condensed", "Roboto Condensed", "Segoe UI", system-ui, -apple-system, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--text); font: 15px/1.4 var(--font); font-variant-numeric: tabular-nums;
  padding-left: max(0px, env(safe-area-inset-left, 0px)); padding-right: max(0px, env(safe-area-inset-right, 0px));
}
h1, h2, h3, p, ul, ol, dl, dd { margin: 0; padding: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
a { color: var(--ice); }
:focus-visible { outline: 2px solid var(--ice); outline-offset: 2px; }

#app { display: grid; grid-template-columns: minmax(300px, 360px) 1fr; height: 100%; min-height: 640px; }
#side { display: flex; flex-direction: column; min-height: 0; background: var(--panel); border-right: 1px solid var(--edge); }
#stage { position: relative; min-width: 0; min-height: 0; background: #070c11; overflow: hidden; touch-action: none; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; }
#cv.drag { cursor: grabbing; }

#brand { padding: 16px max(16px, env(safe-area-inset-left, 0px)) 10px 16px; }
#brand h1 { font: 400 36px/0.95 var(--display); letter-spacing: 0.1em; text-transform: uppercase; color: #fff; }
#brand h1 small { display: inline-block; font-size: 20px; letter-spacing: 0.14em; color: var(--gold); margin-left: 8px; }
#sub { margin-top: 6px; color: var(--haze); font-size: 13px; }
#full { display: inline-block; margin-top: 8px; font-size: 13px; }
.legend { list-style: none; display: flex; flex-wrap: wrap; gap: 4px 10px; margin-top: 10px; }
.legend li { display: flex; align-items: center; gap: 5px; font: 400 18px/1 var(--display); letter-spacing: 0.04em; }
.legend i { width: 11px; height: 11px; border-radius: 2px; border: 1.5px solid; display: block; }

#searchWrap { padding: 0 16px 10px; position: relative; }
#search { width: 100%; background: var(--bg); color: var(--text); border: 1px solid var(--edge); border-radius: 7px; padding: 9px 12px; font: inherit; }
#search::placeholder { color: var(--haze); }
#results { position: absolute; left: 16px; right: 16px; top: 100%; margin-top: -6px; z-index: 5; list-style: none; background: var(--panel-2); border: 1px solid var(--edge); border-radius: 8px; max-height: 300px; overflow: auto; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); }
#results button { width: 100%; display: flex; align-items: center; gap: 10px; text-align: left; background: transparent; border: 0; padding: 8px 10px; }
#results button:hover, #results button:focus-visible { background: var(--ice-dim); }
#results .none { padding: 10px; color: var(--haze); font-size: 13px; }

#tabs { display: flex; border-top: 1px solid var(--edge); border-bottom: 1px solid var(--edge); }
#tabs button { flex: 1; background: transparent; border: 0; border-bottom: 3px solid transparent; color: var(--haze); font: 400 21px/1 var(--display); letter-spacing: 0.08em; text-transform: uppercase; padding: 9px 2px 6px; }
#tabs button[aria-selected="true"] { color: #fff; border-bottom-color: var(--ice); }
#body { flex: 1; min-height: 0; overflow-y: auto; padding: 6px 16px 18px; }
#body h2 { font: 400 22px/1 var(--display); letter-spacing: 0.1em; color: var(--ice); text-transform: uppercase; margin: 16px 0 7px; }
.dim { color: var(--haze); font-size: 13px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; background: var(--bg); border: 1.5px solid var(--edge); border-radius: 6px; padding: 5px 9px; font-size: 13px; }
.chip b { font: 400 19px/1 var(--display); letter-spacing: 0.04em; }
.chip i { width: 10px; height: 10px; border-radius: 2px; border: 1.5px solid; }
.chip[aria-pressed="true"] { background: var(--ice-dim); border-color: var(--ice); }
.chip[aria-pressed="false"] { opacity: 0.6; }
.chip span { color: var(--haze); }
.switch { display: flex; align-items: center; gap: 10px; background: transparent; border: 0; padding: 6px 0; text-align: left; }
.switch i { flex: none; width: 34px; height: 18px; border-radius: 9px; background: #26323f; border: 1.5px solid var(--edge); position: relative; }
.switch i::after { content: ""; position: absolute; top: 2px; left: 2px; width: 11px; height: 11px; border-radius: 50%; background: var(--haze); transition: transform 0.15s; }
.switch[aria-pressed="true"] i { background: var(--ice-dim); border-color: var(--ice); }
.switch[aria-pressed="true"] i::after { transform: translateX(16px); background: var(--ice); }
.link { background: none; border: 0; color: var(--ice); padding: 0; text-decoration: underline; font-size: 13px; }

.rows { list-style: none; margin-top: 6px; }
.rows button { width: 100%; display: grid; grid-template-columns: 46px 1fr auto; gap: 10px; align-items: center; text-align: left; background: transparent; border: 0; border-radius: 6px; padding: 7px 4px; }
.rows button:hover { background: var(--ice-dim); }
.rows .nm { font-weight: 600; line-height: 1.15; min-width: 0; }
.rows small { display: block; color: var(--haze); font-weight: 400; font-size: 12px; margin-top: 1px; }
.rows .val { font-weight: 600; font-size: 14px; white-space: nowrap; }
.rows em { font-style: normal; color: var(--gold); }
.tag { display: inline-block; min-width: 44px; text-align: center; font: 400 18px/1 var(--display); letter-spacing: 0.04em; color: #111; padding: 4px 4px 3px; border: 1.5px solid; border-radius: 5px; }
.seg { display: flex; gap: 4px; margin-top: 4px; }
.seg button { flex: 1; background: var(--bg); border: 1px solid var(--edge); border-radius: 6px; padding: 6px 4px; font-size: 13px; }
.seg button[aria-pressed="true"] { background: var(--ice-dim); border-color: var(--ice); }

/* card */
#card .top { display: flex; gap: 12px; align-items: center; margin-top: 12px; }
#card .tag { font-size: 26px; padding: 6px 8px 4px; min-width: 56px; }
#card h2 { margin: 0; font-size: 28px; color: #fff; }
#card .back { margin-top: 12px; }
dl.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 12px; margin-top: 14px; }
dl.stats dt { color: var(--haze); font-size: 12px; }
dl.stats dd { font-weight: 600; font-size: 15px; }
#card h3 { font: 400 20px/1 var(--display); letter-spacing: 0.08em; text-transform: uppercase; color: var(--ice); margin: 16px 0 5px; }
#card p + p { margin-top: 5px; }
.lead.good { color: var(--good); font-weight: 600; }
.lead.late { color: var(--warn); font-weight: 600; }
ul.cav { padding-left: 18px; font-size: 13px; }
ul.cav li + li { margin-top: 5px; }
.story { white-space: pre-wrap; font-size: 13px; color: #c4d2de; background: rgba(0, 0, 0, 0.25); border-radius: 6px; padding: 10px; margin-top: 6px; }
.watch { margin-top: 16px; width: 100%; background: var(--ice); color: #08131c; border: 0; border-radius: 7px; padding: 11px; font-weight: 700; }
.watch:disabled { background: #2a3744; color: var(--haze); cursor: default; }
.src { margin-top: 14px; color: var(--haze); font-size: 12px; }

/* stage overlays */
#zoom { position: absolute; top: 12px; right: 12px; display: flex; flex-direction: column; gap: 6px; }
#zoom button, #fit { background: rgba(14, 24, 34, 0.9); border: 1px solid var(--edge); border-radius: 7px; width: 38px; height: 38px; font-size: 20px; line-height: 1; }
#zoom button:hover, #fit:hover { border-color: var(--ice); }
#tip { position: absolute; pointer-events: none; z-index: 4; background: rgba(8, 14, 21, 0.96); border: 1px solid var(--edge); border-radius: 6px; padding: 5px 9px; font-size: 13px; white-space: nowrap; }
#tip b { font: 400 18px/1 var(--display); letter-spacing: 0.05em; margin-right: 6px; }
#hint { position: absolute; left: 12px; bottom: 12px; color: var(--haze); font-size: 12px; background: rgba(8, 14, 21, 0.75); padding: 4px 8px; border-radius: 5px; pointer-events: none; }
#pb { position: absolute; left: 12px; right: 12px; bottom: 12px; background: rgba(10, 17, 24, 0.94); border: 1px solid var(--edge); border-radius: 10px; padding: 10px 14px 12px; }
#pb[hidden] { display: none; }
#pbTop { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; }
#pbTop strong { font: 400 26px/1 var(--display); letter-spacing: 0.06em; }
#pbRead { display: flex; flex-wrap: wrap; gap: 4px 18px; font-size: 13px; color: var(--haze); margin-left: auto; }
#pbRead b { color: var(--text); font-weight: 600; }
#pbCtl { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 8px; }
#pbCtl button { background: var(--panel-2); border: 1px solid var(--edge); border-radius: 6px; padding: 6px 11px; font-size: 13px; }
#pbCtl button[aria-pressed="true"] { border-color: var(--ice); background: var(--ice-dim); }
#pbCtl .play { background: var(--ice); color: #08131c; font-weight: 700; min-width: 70px; border: 0; }
#speeds { display: flex; gap: 4px; }
#scrub { flex: 1; min-width: 80px; accent-color: var(--ice); }
#pbNote { margin-top: 7px; font-size: 12px; color: var(--haze); }
#tags { list-style: none; display: flex; flex-wrap: wrap; gap: 6px; margin-top: 7px; }
#tags li { font-size: 11.5px; color: var(--haze); border: 1px solid var(--edge); border-radius: 999px; padding: 2px 9px; }

@media (max-width: 760px) {
  /* The map stays pinned on top; the panel scrolls beneath it so a picked tornado is always in view. */
  #app { grid-template-columns: 1fr; grid-template-rows: minmax(250px, 46%) minmax(0, 1fr); min-height: 560px; }
  #stage { order: -1; }
  #side { border-right: 0; border-top: 1px solid var(--edge); overflow-y: auto; }
  #body { flex: none; overflow: visible; }
  #brand h1 { font-size: 32px; }
  #pbRead { margin-left: 0; gap: 2px 12px; }
  #pb { left: 8px; right: 8px; bottom: 8px; padding: 8px 10px 10px; }
  #pbNote, #tags { display: none; }
  #pbTop strong { font-size: 22px; }
  #hint { display: none; }
}
@media (prefers-reduced-motion: reduce) { .switch i::after { transition: none; } }
</style>

<div id="app">
  <aside id="side">
    <header id="brand">
      <h1>Twister Chaser<small>Lite</small></h1>
      <p id="sub"></p>
      <a id="full" href="https://brendanurganus.github.io/twisterchaser/" target="_blank" rel="noopener">Open the full 3D version with terrain and funnel</a>
      <ul class="legend" id="legend" aria-label="EF rating colors"></ul>
    </header>
    <div id="searchWrap">
      <input id="search" type="search" placeholder="Search a tornado, town or state" autocomplete="off" spellcheck="false" aria-label="Search tornadoes">
      <ul id="results" hidden></ul>
    </div>
    <nav id="tabs" role="tablist" aria-label="Panels">
      <button role="tab" data-tab="filters" aria-selected="true">Filters</button>
      <button role="tab" data-tab="lists" aria-selected="false">Lists</button>
      <button role="tab" data-tab="famous" aria-selected="false">Famous</button>
      <button role="tab" data-tab="about" aria-selected="false">About</button>
    </nav>
    <div id="body"></div>
  </aside>

  <main id="stage">
    <canvas id="cv" aria-label="Flat map of tornado tracks. Use the search or the lists to pick a tornado with the keyboard."></canvas>
    <div id="zoom">
      <button id="zin" aria-label="Zoom in">+</button>
      <button id="zout" aria-label="Zoom out">&minus;</button>
      <button id="fit" aria-label="Show the whole country" title="Show the whole country">&#x2922;</button>
    </div>
    <div id="tip" hidden></div>
    <div id="hint">Drag to move. Scroll or pinch to zoom. Click a track.</div>
    <section id="pb" hidden aria-label="Playback">
      <div id="pbTop"><strong id="pbName"></strong><div id="pbRead"></div></div>
      <div id="pbCtl">
        <button class="play" id="pbPlay">Play</button>
        <button id="pbRestart" aria-label="Restart">&#x21BA;</button>
        <input id="scrub" type="range" min="0" max="1000" value="0" aria-label="Position along the path">
        <span id="speeds" role="group" aria-label="Speed"></span>
        <button id="pbClose">Close</button>
      </div>
      <p id="pbNote"></p>
      <ul id="tags"></ul>
    </section>
  </main>
</div>

<script id="data" type="application/json">/*__DATA__*/null</script>
<script>
(() => {
  'use strict';
  const D = JSON.parse(document.getElementById('data').textContent);
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const num = (v, d = 0) => v.toLocaleString('en-US', { maximumFractionDigits: d, minimumFractionDigits: d });
  const EF_FILL = ['#C1E9C1', '#66A366', '#FFE066', '#FFA366', '#E06666', '#EE99EE'];
  const EF_LINE = ['#55BB55', '#2E7D32', '#DDAA00', '#FF6600', '#CC0000', '#CC00CC'];
  const GOLD = '#ffd36e', RED = '#e0453a', EARTH = 6371000, YD = 0.9144;
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

  // ---- projection: Albers equal-area conic for the lower 48 ----------------------------------
  const R = Math.PI / 180, p1 = 29.5 * R, p2 = 45.5 * R, p0 = 37.5 * R, l0 = -96 * R;
  const nn = (Math.sin(p1) + Math.sin(p2)) / 2, CC = Math.cos(p1) ** 2 + 2 * nn * Math.sin(p1);
  const rho0 = Math.sqrt(CC - 2 * nn * Math.sin(p0)) / nn;
  const proj = (lo, la) => {
    const rho = Math.sqrt(CC - 2 * nn * Math.sin(la * R)) / nn, th = nn * (lo * R - l0);
    return [rho * Math.sin(th), rho0 - rho * Math.cos(th)];
  };
  const hav = (a, b) => {
    const dLa = (b[1] - a[1]) * R, dLo = (b[0] - a[0]) * R;
    const h = Math.sin(dLa / 2) ** 2 + Math.cos(a[1] * R) * Math.cos(b[1] * R) * Math.sin(dLo / 2) ** 2;
    return 2 * EARTH * Math.asin(Math.sqrt(h));
  };

  // ---- data prep --------------------------------------------------------------------------------
  const all = [...D.t, ...D.f];
  const byId = new Map(all.map((t) => [t.id, t]));
  const dateFmt = (tz) => new Intl.DateTimeFormat('en-US', { timeZone: tz, weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });
  const clockFmt = (tz, sec) => new Intl.DateTimeFormat('en-US', { timeZone: tz, hour: 'numeric', minute: '2-digit', ...(sec ? { second: '2-digit' } : {}), timeZoneName: 'short' });
  const monthOf = (t) => Number(new Intl.DateTimeFormat('en-US', { timeZone: t.tz, month: 'numeric' }).format(Date.parse(t.s))) - 1;
  for (const t of all) {
    t.pp = t.p.map(([lo, la]) => proj(lo, la));
    if (t.pp.length < 2) t.pp = [t.pp[0], t.pp[0]];
    t.cum = [0];
    for (let i = 1; i < t.p.length; i++) t.cum.push(t.cum[i - 1] + hav(t.p[i - 1], t.p[i]));
    t.total = t.cum[t.cum.length - 1] || 1;
    t.mo = monthOf(t);
    t.label = t.fam ? `${t.n} ${t.yr}` : t.n;
    t.rl = t.rt ?? `EF${t.ef}`;
    const m = t.pp[Math.floor(t.pp.length / 2)];
    t.mid = m;
    let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
    for (const [x, y] of t.pp) { x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x); y1 = Math.max(y1, y); }
    t.bb = [x0, y0, x1, y1];
  }
  const states = D.states.map((r) => r.map(([lo, la]) => proj(lo, la)));
  const search = all.map((t) => ({ t, key: `${t.n} ${t.nr ?? ''} ${t.st ?? ''} ${t.fam ? 'famous ' + t.yr : ''}`.toLowerCase() }));

  // ---- filter state -------------------------------------------------------------------------------
  const F = { ef: new Set([0, 1, 2, 3, 4, 5]), months: new Set(), minDeaths: 0, famous: true, warn: false };
  const matches = (t, skip = '') => (skip === 'ef' || F.ef.has(t.ef)) && (skip === 'mo' || !F.months.size || F.months.has(t.mo)) && t.de >= F.minDeaths;
  const visible = () => D.t.filter((t) => matches(t));
  let sel = null, hover = null;

  // ---- canvas + view ------------------------------------------------------------------------------
  const cv = $('cv'), ctx = cv.getContext('2d'), stage = $('stage');
  let W = 0, H = 0, dpr = 1;
  const view = { cx: 0, cy: 0, k: 1 };
  let allBB = [1e9, 1e9, -1e9, -1e9];
  for (const r of states) for (const [x, y] of r) { allBB = [Math.min(allBB[0], x), Math.min(allBB[1], y), Math.max(allBB[2], x), Math.max(allBB[3], y)]; }
  const sx = (x) => W / 2 + (x - view.cx) * view.k, sy = (y) => H / 2 - (y - view.cy) * view.k;
  // bottom: pixels at the bottom of the map that a panel covers, so the fitted area stays clear of it.
  function fitBB(bb, pad = 40, maxK = Infinity, bottom = 0) {
    const k = Math.min((W - 2 * pad) / Math.max(1e-9, bb[2] - bb[0]), (H - bottom - 2 * pad) / Math.max(1e-9, bb[3] - bb[1]), maxK);
    return { cx: (bb[0] + bb[2]) / 2, cy: (bb[1] + bb[3]) / 2 - bottom / 2 / k, k };
  }
  let anim = 0;
  function goto(v, ms = 650) {
    cancelAnimationFrame(anim);
    if (reduced || ms === 0) { Object.assign(view, v); draw(); return; }
    const a = { ...view }, t0 = performance.now();
    const step = (now) => {
      const u = Math.min(1, (now - t0) / ms), e = u < 0.5 ? 2 * u * u : 1 - (-2 * u + 2) ** 2 / 2;
      view.cx = a.cx + (v.cx - a.cx) * e; view.cy = a.cy + (v.cy - a.cy) * e;
      view.k = Math.exp(Math.log(a.k) + (Math.log(v.k) - Math.log(a.k)) * e);
      draw();
      if (u < 1) anim = requestAnimationFrame(step);
    };
    anim = requestAnimationFrame(step);
  }
  const home = () => fitBB(allBB, 24);
  const kMin = () => home().k * 0.8, kMax = () => home().k * 400;
  function resize() {
    const r = stage.getBoundingClientRect();
    dpr = Math.min(devicePixelRatio || 1, 2);
    W = Math.max(1, r.width); H = Math.max(1, r.height);
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    if (!resize.done) { Object.assign(view, home()); resize.done = true; }
    draw();
  }
  new ResizeObserver(resize).observe(stage);

  // ---- drawing ----------------------------------------------------------------------------------------
  const widthPx = (t) => (t.wd ? (t.wd * YD / EARTH) * view.k : 0);
  let queued = false;
  function draw() {
    if (queued) return; queued = true;
    requestAnimationFrame(() => { queued = false; paint(); });
  }
  function trace(pp) {
    ctx.beginPath();
    pp.forEach(([x, y], i) => (i ? ctx.lineTo(sx(x), sy(y)) : ctx.moveTo(sx(x), sy(y))));
  }
  function paint() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    ctx.fillStyle = '#0e1b27'; ctx.strokeStyle = 'rgba(131,152,173,0.38)'; ctx.lineWidth = 1;
    for (const r of states) { trace(r); ctx.closePath(); ctx.fill(); ctx.stroke(); }
    const list = [...visible(), ...(F.famous ? D.f : [])].filter((t) => {
      const [x0, y0, x1, y1] = t.bb;
      return sx(x1) > -20 && sx(x0) < W + 20 && sy(y0) > -20 && sy(y1) < H + 20;
    }).sort((a, b) => a.ef - b.ef);
    const dim = pb.t ? 0.25 : 1;
    for (const t of list) {
      if (pb.t && pb.t.id !== t.id) ctx.globalAlpha = dim; else ctx.globalAlpha = 1;
      const wpx = widthPx(t);
      if (wpx > 3 && !(pb.t && pb.t.id === t.id)) {
        trace(t.pp); ctx.strokeStyle = EF_FILL[t.ef]; ctx.globalAlpha *= 0.55; ctx.lineWidth = wpx; ctx.stroke(); ctx.globalAlpha = pb.t && pb.t.id !== t.id ? dim : 1;
      }
      trace(t.pp);
      ctx.strokeStyle = '#060b10'; ctx.lineWidth = (wpx > 3 ? 1.4 : 2 + t.ef * 0.55) + 2; ctx.stroke();
      ctx.strokeStyle = EF_FILL[t.ef]; ctx.lineWidth = wpx > 3 ? 1.4 : 1.3 + t.ef * 0.55; ctx.stroke();
    }
    ctx.globalAlpha = 1;
    for (const id of [hover, sel]) {
      const t = id && byId.get(id); if (!t) continue;
      trace(t.pp); ctx.strokeStyle = '#fff'; ctx.globalAlpha = id === sel ? 0.95 : 0.55; ctx.lineWidth = 3 + t.ef * 0.55; ctx.stroke(); ctx.globalAlpha = 1;
      trace(t.pp); ctx.strokeStyle = EF_FILL[t.ef]; ctx.lineWidth = 1.5 + t.ef * 0.5; ctx.stroke();
    }
    if (F.famous) {
      ctx.font = '19px VT323, "Courier New", monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
      for (const t of D.f) {
        const x = sx(t.mid[0]), y = sy(t.mid[1]);
        if (x < -20 || x > W + 20 || y < -20 || y > H + 20 || pb.t) continue;
        const ringA = Math.max(0, Math.min(1, 1 - (Math.log(view.k / home().k) - 2.2) / 1.2));
        if (ringA <= 0) continue;

    ctx.beginPath(); ctx.arc(x, y, Math.max(7, wpx / 2), 0, 6.2832);
    ctx.fillStyle = 'rgba(255,255,255,0.18)'; ctx.fill(); ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
    ctx.beginPath(); ctx.arc(x, y, 3.5, 0, 6.2832); ctx.fillStyle = '#fff'; ctx.fill();
  }

  // ---- go ----------------------------------------------------------------------------------------------------------------------------------------------
  render();
  const id0 = location.hash.startsWith('#t-') ? location.hash.slice(3) : '';
  resize();
  if (id0 && byId.has(id0)) select(id0);
  window.tcl = { select, view, F, openPlayback: (id) => { select(id); openPlayback(byId.get(id)); }, pb, goto, home };
})();
